id: kafka
nome: Apache Kafka
categoria: Mensageria
descricao: Log distribuído, nó único em modo KRaft (sem ZooKeeper).
icone: apachekafka
image: apache/kafka:3.9.0
porta: 9092
volumes:
  - /var/lib/kafka/data
env:
  - key: KAFKA_NUM_PARTITIONS
    label: Partições por tópico
    descricao: Padrão para tópicos criados automaticamente.
    padrao: "3"
    obrigatorio: true
# Configuração de KRaft de nó único. Errar um desses e o broker não sobe,
# então fica fora do formulário.
env_fixo:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://{{.Host}}:9092
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
injeta:
  KAFKA_BOOTSTRAP_SERVERS: "{{.Host}}:9092"
