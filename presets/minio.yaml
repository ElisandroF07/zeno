id: minio
nome: MinIO
categoria: Armazenamento
descricao: Object storage compatível com S3. Traz console próprio.
icone: minio
image: minio/minio:latest
porta: 9000
volumes:
  - /data
env:
  - key: MINIO_ROOT_USER
    label: Access key
    padrao: zeno
    obrigatorio: true
  - key: MINIO_ROOT_PASSWORD
    label: Secret key
    descricao: Mínimo de 8 caracteres — o MinIO recusa menos.
    tipo: senha
    gerar: senha
cmd: ["server", "/data", "--console-address", ":9001"]
admin_ui:
  porta: 9001
  nome: Console
injeta:
  S3_ENDPOINT: "http://{{.Host}}:9000"
  S3_ACCESS_KEY: "{{.Env.MINIO_ROOT_USER}}"
  S3_SECRET_KEY: "{{.Env.MINIO_ROOT_PASSWORD}}"
